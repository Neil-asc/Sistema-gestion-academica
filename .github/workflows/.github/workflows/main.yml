name: Pipeline CI/CD Innovatec

on:
  push:
    branches: [ "principal" ]
  pull_request:
    branches: [ "principal" ]

jobs:
  ejecutar-pruebas:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v3

    - name: Preparar entorno de Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Correr pruebas unitarias
      run: |
        python -m unittest test_app.py

    - name: Probar ejecucion del sistema principal
      run: |
        python appy.py
